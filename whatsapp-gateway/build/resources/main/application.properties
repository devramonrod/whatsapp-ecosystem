quarkus.http.port=8081

# Kafka config (Producer)
mp.messaging.outgoing.whatsapp-message-received.connector=smallrye-kafka
mp.messaging.outgoing.whatsapp-message-received.topic=whatsapp.message.received
mp.messaging.outgoing.whatsapp-message-received.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Kafka config (Consumer)
mp.messaging.incoming.whatsapp-message-send.connector=smallrye-kafka
mp.messaging.incoming.whatsapp-message-send.topic=whatsapp.message.send
mp.messaging.incoming.whatsapp-message-send.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer

