quarkus:
  http:
    port: 8082
    cors: true
  datasource:
    db-kind: postgresql
    username: user
    password: password
    jdbc:
      url: "jdbc:postgresql://localhost:5432/whatsapp_ai_db"
  hibernate-orm:
    database:
      generation: update

mp:
  messaging:
    incoming:
      whatsapp-message-received:
        connector: smallrye-kafka
        topic: whatsapp.message.received
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      whatsapp-message-send:
        connector: smallrye-kafka
        topic: whatsapp.message.send
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer

